<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>libspnavdev WebHID test</title>
	<style>
		body { font: 16px/1.5 sans-serif; margin: 2rem auto; max-width: 95%; }
		button { padding: 0.6rem 1rem; }
		textarea { box-sizing: border-box; display: block; height: 25rem; margin-top: 1rem; width: 100%; background-color:#000; color:#fff; font-family:'Lucida Console',Monaco,monospace; }
	</style>
	<script>
		var Module = {
			print: function () {
				var message = Array.prototype.join.call(arguments, " ");
				console.log(message);
				appendOutput(message);
			},
			printErr: function (message) {
				console.error(message);
				appendOutput(message);
			},
			onRuntimeInitialized: function () {
				document.getElementById("request-device").disabled = false;
			}
		};

		function appendOutput(message) {
			var output = document.getElementById("output");
			output.value += message + "\n";
			output.scrollTop = output.scrollHeight;
		}

		function requestHIDDevice() {
			Module.ccall("test", null, [], [], { async: true });
		}
	</script>
</head>
<body>
	<h1>libspnavdev WebHID test</h1>
	<p>Connect a supported SpaceMouse, press the button below, then grant access to it in the browser prompt.</p>
	<button id="request-device" onclick="requestHIDDevice()" disabled>Request HID device</button>
	<textarea id="output" rows="12" readonly></textarea>
	{{{ SCRIPT }}}
</body>
</html>
